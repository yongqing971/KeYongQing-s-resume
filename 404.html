<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面走丢了 | 柯永庆</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
  :root{
    --bg:#ECECEA; --card:#F5F5F3; --ink:#161616; --ink-2:#5C5C59;
    --line:#DADAD8; --neu-hi:#FFFFFF; --neu-lo:#CFCFCD;
    --accent:#00BE77; --accent-ink:#0A9E63; --accent-soft:rgba(0,190,119,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101014; --card:#17171C; --ink:#F2F2F4; --ink-2:#9E9EA6;
      --line:#26262E; --neu-hi:#232329; --neu-lo:#070709;
      --accent:#00D68F; --accent-ink:#3BEBA8; --accent-soft:rgba(0,214,143,.12);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;transition:background .3s ease,color .3s ease;
  }
  .card{
    background:var(--card);border-radius:20px;
    box-shadow:10px 10px 24px var(--neu-lo), -10px -10px 24px var(--neu-hi);
    padding:52px 44px;max-width:520px;width:92%;text-align:center;
  }
  .code{
    font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
    font-size:64px;font-weight:800;color:var(--ink);letter-spacing:2px;
  }
  .code i{font-style:normal;color:var(--accent);}
  h1{font-size:20px;margin-top:8px;}
  p{font-size:14.5px;color:var(--ink-2);margin-top:12px;}
  .links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px;}
  a{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--ink);color:var(--bg);text-decoration:none;
    font-size:14.5px;font-weight:600;padding:11px 18px;border-radius:12px;
    border:1px solid var(--ink);
    box-shadow:4px 4px 10px var(--neu-lo), -4px -4px 10px var(--neu-hi);
    transition:all .2s;
  }
  a:hover{background:var(--accent);border-color:var(--accent);color:#0B0B0D;}
  a.ghost{background:transparent;color:var(--ink);}
  a.ghost:hover{background:var(--ink);color:var(--bg);}
</style>
</head>
<body>
  <div class="card">
    <div class="code">4<i>0</i>4</div>
    <h1>页面走丢了 · Page Not Found</h1>
    <p>你访问的页面不存在或已被移动，返回首页查看完整简历。</p>
    <div class="links">
      <a href="https://keyongqing.tech/">返回首页</a>
      <a class="ghost" href="https://keyongqing.tech/assets/柯永庆_简历.pdf" target="_blank" rel="noopener">下载 PDF 简历</a>
    </div>
  </div>
</body>
</html>
